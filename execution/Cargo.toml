[package]
name = "shroudforge-api"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[dependencies]
shroudforge-runtime-bridge = { path = "../kfc-runtime/bridge" }
shroudforge-news.workspace = true
shroudforge-loader-config.workspace = true
shroudforge-runtime-diagnostics = { path = "../modules/runtime-diagnostics" }
shroudforge-steam-networking = { path = "../modules/transport" }
shroudforge-game-assets = { path = "../game-assets" }
shroudforge-compatibility = { path = "../kfc-runtime/compatibility" }
kfc = { path = "../kfc-parser/crates/kfc", features = ["resource", "content"] }
mod-loader = { package = "shroudforge-package", path = "../modules/modloader" }

thiserror = "2.0"
walkdir = "2.5"
anyhow = { version = "1.0", features = ["backtrace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.9", features = ["serde"] }
parking_lot = "0.12"
uuid = { version = "1.18", features = ["v4"] }
crc = "3.3"
sha2 = "0.10"
camino = "1.1"
bitflags = { version = "2.8", features = ["serde"] }
half = "2.6"
image = "0.25"
tracing = "0.1"
mlua = { version = "0.11.2", features = ["lua54", "error-send", "vendored"] }
once_cell = "1.21.3"
ouroboros = "0.18.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "export_kfc_resources"
path = "../dev/profiles/export_kfc_resources.rs"

[[example]]
name = "inspect_attribute_resources"
path = "../dev/profiles/export_kfc_resources.rs"

[[example]]
name = "inspect_building_inputs"
path = "../dev/profiles/export_kfc_resources.rs"

[[example]]
name = "inspect_system_dependencies"
path = "../dev/profiles/inspect_system_dependencies.rs"

[[example]]
name = "inspect_runtime_functions"
path = "../dev/profiles/inspect_system_dependencies.rs"

[[test]]
name = "flight"
path = "tests/flight.rs"

[[test]]
name = "runtime_overrides"
path = "tests/runtime_overrides.rs"

[[test]]
name = "survival"
path = "tests/survival.rs"

[[test]]
name = "bundled_lua"
path = "tests/bundled_lua.rs"
