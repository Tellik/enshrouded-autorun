[workspace]
resolver = "2"
members = [
    "entrypoints/loader",
    "kfc-runtime/compatibility",
    "kfc-runtime/bridge",
    "execution",
    "modules/loader-config",
    "modules/logging",
    "modules/ui-resources",
    "game-assets",
    "modules/commands",
    "modules/debug-console",
    "modules/modloader",
    "modules/modloader/ui",
    "modules/updater",
    "modules/runtime-diagnostics",
    "modules/transport",
    "modules/world-editor",
    "modules/notifications",
]
exclude = ["kfc-parser", "kfc-parser/crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.88.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
semver = { version = "1.0", features = ["serde"] }
shroudforge-package = { path = "modules/modloader" }

shroudforge-loader-config = { path = "modules/loader-config" }
shroudforge-logging = { path = "modules/logging" }
shroudforge-game-assets = { path = "game-assets" }
shroudforge-news = { path = "modules/notifications" }
shroudforge-ui-resources = { path = "modules/ui-resources" }
shroudforge-updater = { path = "modules/updater" }
