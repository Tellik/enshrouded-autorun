name: Autorun Standalone Mod Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and package mod for stock ShroudForge
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build package-local Windows x64 plugin
        run: |
          $visualStudio = & .\dev\build\find_visual_studio.ps1
          $cmake = Join-Path $visualStudio 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe'
          & $cmake -S .\standalone\autorun\native -B .\build\autorun-plugin -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Standalone plugin configuration failed.' }
          & $cmake --build .\build\autorun-plugin --config Release --target enshrouded-autorun
          if ($LASTEXITCODE -ne 0) { throw 'Standalone plugin build failed.' }
          $plugin = Get-ChildItem .\build\autorun-plugin -Recurse -Filter autorun.dll | Select-Object -First 1
          if (-not $plugin) { throw 'Standalone plugin DLL is missing.' }
          python .\dev\build\package_autorun.py --dll $plugin.FullName --out .\build\autorun-0.2.0.zip
          if ($LASTEXITCODE -ne 0) { throw 'Standalone mod packaging failed.' }
          python .\dev\build\package_autorun.py --verify .\build\autorun-0.2.0.zip
          if ($LASTEXITCODE -ne 0) { throw 'Standalone mod verification failed.' }

      - name: Upload standalone mod and checksum
        uses: actions/upload-artifact@v7
        with:
          name: autorun-standalone-${{ github.run_id }}
          path: |
            build/autorun-0.2.0.zip
            build/autorun-0.2.0.zip.sha256
          if-no-files-found: error
          retention-days: 7
