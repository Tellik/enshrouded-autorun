name: Autorun Windows Test Build

on:
  workflow_dispatch:
    inputs:
      standalone_only:
        description: Build only the independently installable mod ZIP
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: autorun-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source and pinned dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js and cache npm downloads
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules/modloader/ui/package-lock.json

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2

      - name: Record compiler versions and dependency revisions
        run: |
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust compiler is unavailable.' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cargo is unavailable.' }
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node.js is unavailable.' }
          git submodule status --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Submodule inspection failed.' }

      - name: Build and verify standalone mod package
        run: |
          $visualStudio = & .\dev\build\find_visual_studio.ps1
          $runtimeCmake = Join-Path $visualStudio 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe'
          & $runtimeCmake -S .\standalone\autorun\native -B .\build\autorun-plugin -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Standalone plugin configuration failed.' }
          & $runtimeCmake --build .\build\autorun-plugin --config Release --target enshrouded-autorun
          if ($LASTEXITCODE -ne 0) { throw 'Standalone plugin build failed.' }
          $plugin = Get-ChildItem .\build\autorun-plugin -Recurse -Filter autorun.dll | Select-Object -First 1
          if (-not $plugin) { throw 'Standalone plugin DLL is missing.' }
          python .\dev\build\package_autorun.py --dll $plugin.FullName --out .\build\autorun-0.2.0.zip
          if ($LASTEXITCODE -ne 0) { throw 'Standalone mod packaging failed.' }
          python .\dev\build\package_autorun.py --verify .\build\autorun-0.2.0.zip
          if ($LASTEXITCODE -ne 0) { throw 'Standalone mod verification failed.' }

      - name: Build and run client input safety test
        if: ${{ !inputs.standalone_only }}
        run: |
          $visualStudio = & .\dev\build\find_visual_studio.ps1
          $runtimeCmake = Join-Path $visualStudio 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe'
          & $runtimeCmake -S . -B .\build\native-runtime -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Native ECS read test configuration failed.' }
          & $runtimeCmake --build .\build\native-runtime --config Release --target kfc-runtime-test-ecs-read
          if ($LASTEXITCODE -ne 0) { throw 'Native ECS read test build failed.' }
          $test = Get-ChildItem .\build\native-runtime -Recurse -Filter kfc-runtime-test-ecs-read.exe | Select-Object -First 1
          if (-not $test) { throw 'Native ECS read test executable is missing.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native ECS read test failed.' }

      - name: Build, test, and package with upstream build scripts
        if: ${{ !inputs.standalone_only }}
        env:
          AUTORUN_BUILD_NUMBER: autorun-${{ github.run_id }}
        run: .\dev\build\release_build.ps1 -BuildNumber $env:AUTORUN_BUILD_NUMBER

      - name: Upload development package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: enshrouded-autorun-windows-${{ github.run_id }}
          path: |
            build/shroudforge-*-autorun-*.zip
            build/shroudforge-*-autorun-*.zip.sha256
            build/autorun-0.2.0.zip
            build/autorun-0.2.0.zip.sha256
          if-no-files-found: error
          retention-days: 7
