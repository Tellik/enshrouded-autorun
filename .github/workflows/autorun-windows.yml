name: Autorun Windows Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autorun-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build standalone Windows x64 mod
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source and pinned JSON dependency
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build and verify Autorun ZIP
        run: |
          $visualStudio = & .\dev\build\find_visual_studio.ps1
          $runtimeCmake = Join-Path $visualStudio 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe'
          & $runtimeCmake -S .\standalone\autorun\native -B .\build\autorun-plugin -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Autorun plugin configuration failed.' }
          & $runtimeCmake --build .\build\autorun-plugin --config Release --target enshrouded-autorun
          if ($LASTEXITCODE -ne 0) { throw 'Autorun plugin build failed.' }
          $plugin = Get-ChildItem .\build\autorun-plugin -Recurse -Filter autorun.dll | Select-Object -First 1
          if (-not $plugin) { throw 'Autorun plugin DLL is missing.' }
          $manifest = Get-Content .\standalone\autorun\mod.json -Raw | ConvertFrom-Json
          $archive = ".\build\autorun-$($manifest.version).zip"
          python .\dev\build\package_autorun.py --dll $plugin.FullName --out $archive
          if ($LASTEXITCODE -ne 0) { throw 'Autorun packaging failed.' }
          python .\dev\build\package_autorun.py --verify $archive
          if ($LASTEXITCODE -ne 0) { throw 'Autorun package verification failed.' }

      - name: Upload Autorun ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: autorun-windows-${{ github.run_id }}
          path: |
            build/autorun-*.zip
            build/autorun-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
