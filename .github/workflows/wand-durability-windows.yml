name: Wand Durability Windows Package

on:
  push:
    branches: [wand-durability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wand-durability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build and test
        run: |
          cmake -S mods/wand-durability/native -B build/wand-durability -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Configuration failed' }
          cmake --build build/wand-durability --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          ctest --test-dir build/wand-durability -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Verify native hook register and stack contract
        run: |
          python -m pip install unicorn==2.1.4 capstone==5.0.7
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency install failed' }
          python dev/check_wand_hook.py build/wand-durability/Release/export-hook-code.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native hook emulation failed' }
      - name: Package
        run: |
          python dev/build/package_wand_durability.py --dll build/wand-durability/Release/wand-durability.dll --out build/wand-durability-0.2.0.zip
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: wand-durability-windows-${{ github.run_id }}
          path: |
            build/wand-durability-0.2.0.zip
            build/wand-durability-0.2.0.zip.sha256
          if-no-files-found: error
          retention-days: 7
