<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-labelledby="title description">
  <title id="title">Every ShroudForge release is scanned</title>
  <desc id="description">Every release is scanned with Trivy, Microsoft Defender, ClamAV and VirusTotal before publishing.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21414a"/>
      <stop offset="1" stop-color="#0b1316"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="956" height="156" rx="20" fill="url(#panel)" stroke="#385054" stroke-width="2"/>

  <!-- left: neutral shield symbol -->
  <rect x="28" y="52" width="56" height="56" rx="14" fill="#14262b" stroke="#385054" stroke-width="1.5"/>
  <g transform="translate(35 59) scale(1.75)" fill="none" stroke="#cfe0dc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 20 6v6c0 4.5-3.5 7.8-8 9-4.5-1.2-8-4.5-8-9V6z"/>
    <path d="m8.5 12 2.5 2.5 4.5-5"/>
  </g>

  <text x="104" y="57" fill="#e7eeea" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing=".6">Every release is scanned with</text>

  <!-- four scanners: plain names, no invented logos (swap in official logos if you like) -->
  <g id="scanner-trivy">
    <rect x="104" y="73" width="195.5" height="50" rx="10" fill="#14262b" stroke="#385054" stroke-width="1.5"/>
    <text x="201.75" y="94" fill="#e7eeea" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing=".5" text-anchor="middle">Trivy</text>
    <text x="201.75" y="111" fill="#8ea3a3" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing=".3" text-anchor="middle">Vulnerabilities &amp; secrets</text>
  </g>

  <g id="scanner-defender">
    <rect x="311.5" y="73" width="195.5" height="50" rx="10" fill="#14262b" stroke="#385054" stroke-width="1.5"/>
    <text x="409.25" y="94" fill="#e7eeea" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing=".5" text-anchor="middle">Microsoft Defender</text>
    <text x="409.25" y="111" fill="#8ea3a3" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing=".3" text-anchor="middle">Malware scan</text>
  </g>

  <g id="scanner-clamav">
    <rect x="519" y="73" width="195.5" height="50" rx="10" fill="#14262b" stroke="#385054" stroke-width="1.5"/>
    <text x="616.75" y="94" fill="#e7eeea" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing=".5" text-anchor="middle">ClamAV</text>
    <text x="616.75" y="111" fill="#8ea3a3" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing=".3" text-anchor="middle">Malware scan</text>
  </g>

  <g id="scanner-virustotal">
    <rect x="726.5" y="73" width="195.5" height="50" rx="10" fill="#14262b" stroke="#385054" stroke-width="1.5"/>
    <text x="824.25" y="94" fill="#e7eeea" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing=".5" text-anchor="middle">VirusTotal</text>
    <text x="824.25" y="111" fill="#8ea3a3" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing=".3" text-anchor="middle">Multi-engine scan</text>
  </g>
</svg>
