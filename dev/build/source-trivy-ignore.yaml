vulnerabilities:
  - id: GHSA-wrw7-89jp-8q8g
    paths:
      - Cargo.lock
    purls:
      - pkg:cargo/glib@0.18.5
    statement: >-
      glib 0.18.5 is present only through GTK dependencies selected for unsupported
      Linux targets of Tao and Wry. ShroudForge builds and ships Windows targets, and
      repository and dependency sources do not call Variant::array_iter_str. Remove
      this exception when upstream GTK dependencies move to a fixed glib release or
      the supported target changes.
