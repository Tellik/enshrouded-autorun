<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Welche Mods funktionieren bei dir?</title>
  <desc id="description">Ein freundlicher Aufruf, Mod-Kompatibilität kurz mit Ja, Nein oder Problem zu melden.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10191d"/><stop offset="1" stop-color="#1c3033"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1d99a"/><stop offset="1" stop-color="#c9ad6e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#03090b" flood-opacity="0.34"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#background)"/>
  <circle cx="1040" cy="52" r="250" fill="#c9ad6e" opacity="0.08"/>
  <circle cx="584" cy="586" r="210" fill="#77b6aa" opacity="0.07"/>
  <path d="M71 494c81-52 145-59 219-29M646 102c22 11 41 26 56 46" fill="none" stroke="#c9ad6e" stroke-opacity="0.24" stroke-width="2"/>
  <g transform="translate(82 76)">
    <path d="M22 0 44 11 39 37 22 46 5 37 0 11Z" fill="url(#gold)"/>
    <text x="22" y="27" fill="#10191d" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle">SF</text>
    <text x="60" y="28" fill="#e6e2d8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">SHROUDFORGE · COMMUNITY</text>
  </g>
  <text x="82" y="222" fill="#f7f4ec" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-1.4">Welche Mods</text>
  <text x="82" y="290" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-1.4">laufen bei dir?</text>
  <text x="85" y="350" fill="#c7d0cb" font-family="Arial, Helvetica, sans-serif" font-size="21">Ein kurzes Ja, Nein oder Problem hilft mir,</text>
  <text x="85" y="382" fill="#c7d0cb" font-family="Arial, Helvetica, sans-serif" font-size="21">ShroudForge Schritt für Schritt zu verbessern.</text>
  <g transform="translate(85 431)">
    <rect width="286" height="58" rx="16" fill="url(#gold)"/>
    <text x="143" y="36" fill="#162124" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Danke fürs Mithelfen</text>
    <path d="M328 28h94m-13-13 13 13-13 13" fill="none" stroke="#c9ad6e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="682" y="104" width="438" height="438" rx="28" fill="#f7f4ec"/>
    <circle cx="1080" cy="126" r="24" fill="#e9ddbf"/>
    <path d="M1073 126c4-8 13-8 16 0 1 8-8 13-8 13s-10-6-8-13Z" fill="#ba755f"/>
    <text x="720" y="158" fill="#63847d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.7">MOD-KOMPATIBILITÄT</text>
    <text x="720" y="194" fill="#172528" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Dein Test in 30 Sekunden</text>
    <text x="720" y="226" fill="#66736f" font-family="Arial, Helvetica, sans-serif" font-size="15">Welches Mod-System verwendest du?</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <rect x="720" y="246" width="72" height="37" rx="11" fill="#e8dfcb"/><text x="756" y="270" fill="#263536">ST</text>
      <rect x="800" y="246" width="84" height="37" rx="11" fill="#dcebe6"/><text x="842" y="270" fill="#263536">EML</text>
      <rect x="892" y="246" width="72" height="37" rx="11" fill="#e8dfcb"/><text x="928" y="270" fill="#263536">SF</text>
      <rect x="972" y="246" width="110" height="37" rx="11" fill="#eceeed"/><text x="1027" y="270" fill="#52615e">Andere</text>
    </g>
    <text x="720" y="321" fill="#66736f" font-family="Arial, Helvetica, sans-serif" font-size="15">Welche Mod hast du getestet?</text>
    <rect x="720" y="337" width="362" height="48" rx="12" fill="#fff" stroke="#d8ded8" stroke-width="1.5"/>
    <text x="738" y="367" fill="#96a09b" font-family="Arial, Helvetica, sans-serif" font-size="15">Name der Mod</text>
    <text x="720" y="420" fill="#66736f" font-family="Arial, Helvetica, sans-serif" font-size="15">Wie lief es?</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      <rect x="720" y="436" width="98" height="44" rx="13" fill="#dcebe6"/><text x="769" y="464" fill="#315d51">Ja</text>
      <rect x="830" y="436" width="98" height="44" rx="13" fill="#eceeed"/><text x="879" y="464" fill="#52615e">Nein</text>
      <rect x="940" y="436" width="142" height="44" rx="13" fill="#f3e2dd"/><text x="1011" y="464" fill="#9b594b">Problem</text>
    </g>
    <text x="720" y="515" fill="#63847d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Ein Satz dazu reicht schon. Danke! ♥</text>
  </g>
  <g fill="#e5c980" opacity="0.8"><path d="M603 218v14m-7-7h14" stroke="#e5c980" stroke-width="2" stroke-linecap="round"/><circle cx="625" cy="344" r="3"/><circle cx="1004" cy="79" r="3"/></g>
</svg>
