[package]
name = "shroudforge-runtime-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[dependencies]
kfc = { path = "../../../kfc-parser/crates/kfc", features = ["resource", "content"] }
serde_json = "1.0"
shroudforge-runtime-diagnostics = { path = "../../runtime-diagnostics" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader"] }
